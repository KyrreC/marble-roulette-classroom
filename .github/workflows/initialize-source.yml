name: Initialize source and deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  initialize:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v6

      - name: Expand verified source archive
        shell: bash
        run: |
          cat source.zip.part1 source.zip.part2 source.zip.part3 > source.zip
          echo "15bf64d84a47d58449b9d2d621c25ef01067bc68a2819c6ff5d842a240af1893  source.zip" | sha256sum -c -
          rm -rf .bootstrap-source
          unzip -q source.zip -d .bootstrap-source
          cp -a .bootstrap-source/. .
          rm -rf .bootstrap-source source.zip
          rm -f source.zip.part1 source.zip.part2 source.zip.part3
          rm -f .github/workflows/initialize-source.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize source formatting
        run: npm run lint

      - name: Verify source
        run: npm run check

      - name: Build GitHub Pages edition
        env:
          PAGES_BASE_PATH: /marble-roulette-classroom/
        run: npm run build:online

      - name: Publish expanded source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish classroom edition"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-online

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
